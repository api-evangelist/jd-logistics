name: JD Logistics
description: 'JD Logistics (Hong Kong listed as 2618.HK) is a technology-driven supply chain and logistics
  service provider spun out of JD.com and backed by the SoftBank Vision Fund. It operates one of China''s
  largest integrated logistics networks, offering express and freight delivery, integrated warehouse-and-fulfillment,
  cold-chain and pharmaceutical logistics, cross-border shipping, oversized-item handling, and smart supply-chain
  technology. Through its JD Logistics Open Platform (open.jdl.com) it exposes enterprise integration
  services for order fulfillment, warehousing, waybill/shipment creation, tracking, and reconciliation to
  merchants and partners. This profile tracks the company''s public developer and open-platform surface in the
  API Evangelist network.'
